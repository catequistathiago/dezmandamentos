<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Os 10 Mandamentos da Igreja Católica</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b1120 0%, #17153b 50%, #2e0854 100%);
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(251, 191, 36, 0.35);
            --gold: #facc15;
            --gold-glow: rgba(250, 204, 21, 0.5);
            --cyan: #38bdf8;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0b1120;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
        }

        .presentation-viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: scale(0.97);
            padding: 50px 70px 100px 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            z-index: 2;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 1400px;
            max-height: 84vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1, h2, .mandamento-num {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            letter-spacing: 1px;
        }

        h1 { font-size: 3.2rem; }
        h2 { font-size: 2.4rem; }

        .slide-text {
            font-size: 1.45rem;
            line-height: 1.6;
            font-weight: 500;
        }

        .text-gold {
            color: var(--gold);
            text-shadow: 0 0 15px var(--gold-glow);
        }

        .text-cyan {
            color: var(--cyan);
        }

        .passagem-biblica {
            font-style: italic;
            border-left: 5px solid var(--gold);
            padding: 12px 20px;
            margin: 20px 0;
            background: rgba(250, 204, 21, 0.12);
            border-radius: 0 12px 12px 0;
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.5;
        }

        .slide-img {
            max-height: 52vh;
            width: 100%;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.2);
        }

        video {
            max-height: 65vh;
            width: 100%;
            max-width: 1000px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.7);
            border: 3px solid var(--gold);
        }

        .top-bar {
            position: absolute;
            top: 20px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .top-title {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .bottom-controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 25px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.15);
            z-index: 10;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--gold);
            width: 0%;
            transition: width 0.3s ease;
        }

        .quiz-option-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.25);
            color: white;
            text-align: left;
            padding: 16px 24px;
            border-radius: 14px;
            transition: all 0.2s;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .quiz-option-btn:hover {
            background: rgba(255,255,255,0.25);
            color: var(--gold);
            border-color: var(--gold);
        }

        .quiz-q-title {
            font-size: 1.6rem;
            font-weight: 700;
        }

        @media (max-height: 800px) {
            .glass-card { padding: 2rem; }
            h1 { font-size: 2.5rem; }
            h2 { font-size: 1.9rem; }
            .slide-text { font-size: 1.25rem; }
            .passagem-biblica { font-size: 1.15rem; }
            .slide-img { max-height: 42vh; }
            .quiz-option-btn { font-size: 1.1rem; padding: 12px 18px; }
        }
    </style>
</head>
<body>

    <div class="presentation-viewport">
        
        <div class="top-bar">
            <span class="top-title text-uppercase opacity-90">
                🇻🇦 Os 10 Mandamentos da Igreja Católica
            </span>
            <button class="btn btn-outline-light btn-lg rounded-pill px-4 fw-bold" onclick="toggleFullscreen()">
                ⛶ Tela Cheia
            </button>
        </div>

        <div id="slides-container"></div>

        <div class="bottom-controls">
            <button class="btn btn-lg btn-dark rounded-circle px-3" onclick="prevSlide()" title="Anterior">◀</button>
            <span id="slide-counter" class="fs-5 fw-bold px-3">1 / --</span>
            <button class="btn btn-lg btn-dark rounded-circle px-3" onclick="nextSlide()" title="Próximo">▶</button>
        </div>

        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>

    </div>

    <script>
        const slidesData = [
            // CAPA
            {
                type: 'cover',
                title: 'OS 10 MANDAMENTOS DA IGREJA CATÓLICA',
                subtitle: 'A Lei de Deus para uma Vida Verdadeira',
                img: 'capa-mandamentos.png',
                desc: 'Estudo simples e profundo sobre os ensinamentos que guiam a vida de todo cristão católico.'
            },
            // VÍDEO
            {
                type: 'video',
                title: 'A Lei de Deus na Nossa Vida',
                subtitle: 'Assista à explicação sobre como os Mandamentos nos ajudam a viver melhor.',
                videoSrc: 'video.mp4'
            },

            // --- 1º MANDAMENTO ---
            {
                type: 'content',
                num: '1º Mandamento',
                title: 'Amar a Deus sobre todas as coisas',
                passage: '"Amarás o Senhor, teu Deus, de todo o teu coração, de toda a tua alma e de todo o teu entendimento. Este é o maior e o primeiro mandamento." (São Mateus 22, 37-38)',
                img: 'mandamento-1.png',

            {
                type: 'content',

                img: 'mandamento-1.png',
                text: 'Este mandamento ensina a não buscar respostas em coisas como horóscopos, feitiçarias, simpatias ou crenças falsas. O cristão deposita toda a sua vida e o seu futuro apenas nas mãos de Deus.'
            },
            {
                type: 'content',
                num: '1º Mandamento',
                title: 'Não Fazer das Coisas o Nosso Deus',
                passage: '"Não terás outros deuses diante de mim." (Êxodo 20, 3)',

            },
            {
                type: 'content',
                num: '1º Mandamento',
                title: 'Adorar a Deus de Coração',

                img: 'mandamento-1.png',
                text: 'Adorar a Deus é reconhecer que fomos criados por Ele. Fazemos isso rezando diariamente, participando da igreja e fazendo o bem aos outros por amor a Deus.'
            },

            // --- 2º MANDAMENTO ---
            {
                type: 'content',
                num: '2º Mandamento',
                title: 'Não tomar seu santo nome em vão',
                passage: '"Não tomarás o nome do Senhor, teu Deus, em vão, porque o Senhor não deixará impune aquele que tomar o seu nome em vão." (Êxodo 20, 7)',

            },
            {
                type: 'content',
                num: '2º Mandamento',
                title: 'Respeito ao Nome Sagrado',

                img: 'mandamento-2.png',

            },
            {
                type: 'content',
                num: '2º Mandamento',
                title: 'O Nosso Nome no Batismo',
                passage: '"Ide e fazei discípulos de todas as nações, batizando-os em nome do Pai, e do Filho, e do Espírito Santo." (São Mateus 28, 19)',

            },
            {
                type: 'content',
                num: '2º Mandamento',
                title: 'Falar Sempre a Verdade',
                passage: '"Seja o vosso falar: Sim, sim; Não, não. O que passa disso vem do Maligno." (São Mateus 5, 37)',

            // --- QUIZ 1 ---
            {

                title: 'Quiz de Fixação: 1º e 2º Mandamentos',

                    {
                        q: 'Uma pessoa diz que consulta o horóscopo só por curiosidade. Qual é o problema real dessa atitude perante o 1º Mandamento se ela passa a tomar decisões com base nisso?',

                            'Não há erro, desde que ela não pague por essa consulta.',
                            'Ela passa a depositar a confiança do seu futuro nos astros e não em Deus.',
                            'O único erro é perder tempo lendo sobre isso pela manhã.',
                            'A Igreja proíbe apenas o estudo científico das estrelas.'
                        ],
                        ans: 1
                    },
                    {
                        q: 'Um jovem faz uma promessa usando o nome de Deus para passar em uma prova sem ter estudado nada. Por que isso fere o 2º Mandamento?',
                        opts: [
                            'Porque ele deveria ter feito a promessa em um local religioso.',
                            'Porque usou o nome sagrado de Deus como barganha para cobrir a sua falta de responsabilidade.',
                            'Não fere o mandamento, pois ele tinha boa intenção ao querer passar.',
                            'Fere o mandamento apenas se a promessa tiver sido feita em voz alta.'
                        ],
                        ans: 1
                    },
                    {
                        q: 'Quando a busca por curtidas, aprovação na internet e fama passa a orientar todas as escolhas de uma pessoa, o que está acontecendo?',
                        opts: [
                            'Ela está apenas se adaptando ao mundo moderno de forma natural.',
                            'Ela transformou a aprovação alheia em um "falso deus", colocando-a acima dos valores morais.',
                            'Ela está cumprindo o mandamento de se comunicar bem.',
                            'Isso só se torna um problema se ela usar palavras agressivas na rede.'

                        ans: 1
                    }
                ]

            // --- 3º MANDAMENTO ---

                type: 'content',
                num: '3º Mandamento',

                img: 'mandamento-3.png',
                text: 'Os cristãos guardam o Domingo porque foi o dia em que Jesus Cristo ressuscitou. É o dia reservado para nos reunirmos em comunidade e darmos graças a Deus.'
            },
            {
                type: 'content',
                num: '3º Mandamento',
                title: 'Participar da Santa Missa',
                passage: '"Isto é o meu Corpo, que é dado por vós; fazei isto em memória de mim." (São Lucas 22, 19)',
                img: 'mandamento-3.png',
                text: 'Ir à Missa aos domingos e festas importantes (como o Natal e a Imaculada Conceição) é um compromisso de amor com Deus para recebermos a Palavra e a Eucaristia.'
            },
            {
                type: 'content',
                num: '3º Mandamento',

            {
                type: 'content',
                num: '3º Mandamento',
                title: 'Não Viver Só para o Trabalho',

                text: 'Santificar o domingo nos impede de virarmos escravos do trabalho e da correria diária. Lembra-nos de que a nossa vida nesta terra tem um sentido muito maior.'
            },

            // --- 4º MANDAMENTO ---
            {
                type: 'content',
                num: '4º Mandamento',
                title: 'Honrar pai e mãe',
                passage: '"Honra teu pai e tua mãe, para que teus dias se prolonguem na terra que o Senhor, teu Deus, te dá." (Êxodo 20, 12)',
                img: 'mandamento-4.png',
                text: 'Este mandamento ensina os filhos a amarem, respeitarem e serem gratos aos seus pais. Exige escutar os seus conselhos e ajudá-los em suas necessidades.'
            },
            {
                type: 'content',
                num: '4º Mandamento',
                title: 'O Papel da Família',
                passage: '"Vós, pais, não provoqueis a ira dos vossos filhos, mas criai-os na disciplina e na instrução do Senhor." (Efésios 6, 4)',
                img: 'mandamento-4.png',
                text: 'Os pais têm a missão dada por Deus de ensinar os primeiros passos na fé, transmitir bons valores e criar um ambiente de respeito e amor dentro de casa.'
            },
            {
                type: 'content',
                num: '4º Mandamento',
                title: 'Cuidar dos Pais na Velhice',
                passage: '"Meu filho, ampara a velhice de teu pai e não o desgostes durante a sua vida." (Eclesiástico 3, 14)',

                type: 'content',
                num: '4º Mandamento',
                title: 'Respeito na Vida em Sociedade',
                passage: '"Dai, pois, a César o que é de César, e a Deus o que é de Deus." (São Mateus 22, 21)',
                img: 'mandamento-4.png',
                text: 'O mandamento também se aplica a respeitar os professores, os idosos e as autoridades que trabalham honestamente pelo bem de todos na sociedade.'
            },

                type: 'quiz',
                title: 'Quiz de Fixação: 3º e 4º Mandamentos',
                questions: [
                    {
                        q: 'Se uma pessoa decide usar todo o domingo para adiantar tarefas e compras, sem dedicar tempo à oração, à missa ou à família, qual é a falha perante o 3º Mandamento?',

                            'Porque os professores possuem grau de parentesco indireto com os alunos.',
                            'Fere o mandamento apenas se a escola for estritamente religiosa.',
                            'Não fere o mandamento, pois este se limita aos pais biológicos.'

                        ans: 0
                    }
                ]

            // --- 5º MANDAMENTO ---

                type: 'content',
                num: '5º Mandamento',
                title: 'Não matar',
                passage: '"Não matarás." (Êxodo 20, 13) / "Antes que no seio materno tu fosses formado, eu já te conhecia." (Jeremias 1, 5)',

                type: 'content',

                text: 'A pureza fortalece a nossa capacidade de amar de forma generosa e madura. Prepara o coração para construir relacionamentos saudáveis, sinceros e abençoados por Deus.'
            },
            {
                type: 'content',
                num: '6º Mandamento',
                title: 'Anotações para Guardar o Coração',

                text: 'Para manter um coração puro e em paz, a Igreja recomenda a oração diária, bons pensamentos, boas leituras e a escolha de amizades que nos ajudem a crescer no bem.'

                type: 'quiz',

                            'Não fere esse mandamento, pois mensagens virtuais não provocam danos físicos.',

        let currentSlideIndex = 0;
        const slidesContainer = document.getElementById('slides-container');
        const slideCounter = document.getElementById('slide-counter');
        const progressFill = document.getElementById('progress-fill');

        function renderSlides() {
            slidesContainer.innerHTML = '';
            
            slidesData.forEach((data, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = `slide ${index === 0 ? 'active' : ''}`;
                slideDiv.id = `slide-${index}`;

                if (data.type === 'cover') {
                    slideDiv.innerHTML = `
                        <div class="glass-card text-center align-items-center">
                            <span class="badge bg-warning text-dark fs-5 px-4 py-2 rounded-pill mb-4 fw-bold">CATECISMO DA IGREJA CATÓLICA</span>
                            <h1 class="display-3 text-gold mb-3">${data.title}</h1>
                            <p class="fs-2 text-cyan mb-4 fw-bold">${data.subtitle}</p>
                            <img src="${data.img}" alt="Capa" class="slide-img mb-4" onerror="this.style.display='none'">
                            <p class="slide-text max-w-800 mx-auto opacity-90">${data.desc}</p>
                        </div>
                    `;
                } else if (data.type === 'video') {
                    slideDiv.innerHTML = `
                        <div class="glass-card text-center align-items-center">
                            <h2 class="text-gold mb-3">${data.title}</h2>
                            <p class="fs-4 text-cyan mb-4">${data.subtitle}</p>
                            <video controls poster="capa-mandamentos.png">
                                <source src="${data.videoSrc}" type="video/mp4">
                                Seu navegador não suporta a exibição deste vídeo em MP4.
                            </video>
                        </div>
                    `;
                } else if (data.type === 'content') {
                    slideDiv.innerHTML = `
                        <div class="glass-card">
                            <div class="row align-items-center h-100">
                                <div class="col-md-7 pe-md-5">
                                    <span class="badge bg-primary mb-3 fs-5 fw-bold px-3 py-2">${data.num}</span>
                                    <h2 class="text-gold mb-3">${data.title}</h2>
                                    <div class="passagem-biblica">${data.passage}</div>
                                    <p class="slide-text mt-4">${data.text}</p>
                                </div>
                                <div class="col-md-5 text-center mt-4 mt-md-0">
                                    <img src="${data.img}" alt="${data.title}" class="slide-img" onerror="this.src='https://via.placeholder.com/700x500/17153b/ffffff?text=${encodeURIComponent(data.num)}'">
                                </div>
                            </div>
                        </div>
                    `;
                } else if (data.type === 'quiz' || data.type === 'quiz-final') {
                    slideDiv.innerHTML = generateQuizHTML(data, index);
                }

                slidesContainer.appendChild(slideDiv);
            });

            updateUI();
        }

        function generateQuizHTML(quizData, slideIdx) {
            return `
                <div class="glass-card" id="quiz-card-${slideIdx}">
                    <div class="text-center mb-4">
                        <span class="badge bg-warning text-dark fs-5 px-4 py-2 mb-2 fw-bold">ENCONTRO CATÓLICO</span>
                        <h2 class="text-gold">${quizData.title}</h2>
                    </div>
                    <div id="quiz-body-${slideIdx}">
                        <div class="quiz-question-box">
                            <p class="quiz-q-title text-cyan mb-4" id="q-text-${slideIdx}">Carregando pergunta...</p>
                            <div class="d-flex flex-column gap-3" id="q-options-${slideIdx}"></div>
                        </div>
                        <div id="q-feedback-${slideIdx}" class="mt-4 text-center fw-bold fs-3"></div>
                        <div class="text-end mt-3">
                            <button class="btn btn-warning btn-lg px-5 fw-bold text-dark fs-4" id="q-next-btn-${slideIdx}" style="display:none;" onclick="nextQuizQuestion(${slideIdx})">Próxima Pergunta ▶</button>
                        </div>
                    </div>
                </div>
            `;
        }

        let quizStates = {};

        function initQuiz(slideIdx) {
            const data = slidesData[slideIdx];
            quizStates[slideIdx] = {
                currentQ: 0,
                score: 0,
                answered: false
            };
            renderQuizQuestion(slideIdx);
        }

        function renderQuizQuestion(slideIdx) {
            const state = quizStates[slideIdx];
            const data = slidesData[slideIdx];
            const q = data.questions[state.currentQ];

            document.getElementById(`q-text-${slideIdx}`).innerText = q.q;
            const optionsContainer = document.getElementById(`q-options-${slideIdx}`);
            optionsContainer.innerHTML = '';
            document.getElementById(`q-feedback-${slideIdx}`).innerText = '';
            document.getElementById(`q-next-btn-${slideIdx}`).style.display = 'none';
            state.answered = false;

            q.opts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option-btn';
                btn.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
                btn.onclick = () => checkQuizAnswer(slideIdx, idx, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkQuizAnswer(slideIdx, selectedIdx, btn) {
            const state = quizStates[slideIdx];
            if (state.answered) return;
            state.answered = true;

            const q = slidesData[slideIdx].questions[state.currentQ];
            const allBtns = document.querySelectorAll(`#q-options-${slideIdx} button`);

            if (selectedIdx === q.ans) {
                btn.style.background = 'rgba(46, 204, 113, 0.45)';
                btn.style.borderColor = '#2ecc71';
                document.getElementById(`q-feedback-${slideIdx}`).innerText = '✅ Resposta Correta!';
                document.getElementById(`q-feedback-${slideIdx}`).style.color = '#2ecc71';
                state.score++;
            } else {
                btn.style.background = 'rgba(231, 76, 60, 0.45)';
                btn.style.borderColor = '#e74c3c';
                allBtns[q.ans].style.background = 'rgba(46, 204, 113, 0.45)';
                allBtns[q.ans].style.borderColor = '#2ecc71';
                document.getElementById(`q-feedback-${slideIdx}`).innerText = '❌ Resposta Incorreta.';
                document.getElementById(`q-feedback-${slideIdx}`).style.color = '#e74c3c';
            }

            document.getElementById(`q-next-btn-${slideIdx}`).style.display = 'inline-block';
        }

        function nextQuizQuestion(slideIdx) {
            const state = quizStates[slideIdx];
            const data = slidesData[slideIdx];
            
            state.currentQ++;
            if (state.currentQ < data.questions.length) {
                renderQuizQuestion(slideIdx);
            } else {
                const card = document.getElementById(`quiz-body-${slideIdx}`);
                card.innerHTML = `
                    <div class="text-center py-4">
                        <h2 class="text-gold mb-3 display-4">Quiz Concluído! 🎉</h2>
                        <p class="fs-2 mb-4">Você acertou <strong class="text-cyan fs-1">${state.score}</strong> de <strong>${data.questions.length}</strong> perguntas.</p>
                        <p class="fs-4 lead">${state.score === data.questions.length ? 'Excelente! Conhecimento muito bom da fé e dos Mandamentos!' : 'Muito bem! Continue participando e aprendendo mais a cada dia.'}</p>
                        <button class="btn btn-outline-light btn-lg mt-4 px-5 fs-4" onclick="initQuiz(${slideIdx})">Reiniciar Quiz 🔄</button>
                    </div>
                `;
            }
        }

        function showSlide(index) {
            if (index < 0 || index >= slidesData.length) return;

            const currentSlideEl = document.getElementById(`slide-${currentSlideIndex}`);
            const nextSlideEl = document.getElementById(`slide-${index}`);

            const activeVideo = currentSlideEl.querySelector('video');
            if (activeVideo) activeVideo.pause();

            currentSlideEl.classList.remove('active');
            nextSlideEl.classList.add('active');

            currentSlideIndex = index;
            updateUI();

            if ((slidesData[index].type === 'quiz' || slidesData[index].type === 'quiz-final') && !quizStates[index]) {
                initQuiz(index);
            }
        }

        function nextSlide() {
            if (currentSlideIndex < slidesData.length - 1) {
                showSlide(currentSlideIndex + 1);
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                showSlide(currentSlideIndex - 1);
            }
        }

        function updateUI() {
            slideCounter.innerText = `${currentSlideIndex + 1} / ${slidesData.length}`;
            const pct = ((currentSlideIndex + 1) / slidesData.length) * 100;
            progressFill.style.width = `${pct}%`;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            }
        });

        window.onload = () => {
            renderSlides();
        };
    </script>
